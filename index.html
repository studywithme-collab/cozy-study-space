<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cozy Study Space ♡</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="room">

        <!-- Corkboard -->
        <div class="corkboard">
            <div class="pin pin-one"></div>
            <div class="pin pin-two"></div>
            <div class="pin pin-three"></div>
        </div>

        <!-- Desk -->
        <div class="desk">

            <!-- Desk mat -->
            <div class="desk-mat"></div>

            <!-- Lamp -->
            <div class="lamp">
                <div class="lamp-shade"></div>
                <div class="lamp-neck"></div>
                <div class="lamp-base"></div>
            </div>

            <!-- Books -->
            <div class="books">
                <div class="book book-one"></div>
                <div class="book book-two"></div>
                <div class="book book-three"></div>
            </div>

            <!-- Plant -->
            <div class="plant">
                <div class="leaf leaf-one"></div>
                <div class="leaf leaf-two"></div>
                <div class="leaf leaf-three"></div>
                <div class="plant-pot"></div>
            </div>

            <!-- Mug -->
            <div class="mug">
                <div class="mug-handle"></div>
            </div>

            <!-- Pencil cup -->
            <div class="pencil-cup">
                <div class="pencil pencil-one"></div>
                <div class="pencil pencil-two"></div>
                <div class="pencil pencil-three"></div>
            </div>

            <!-- Teddy bear -->
            <div class="teddy">
                <div class="ear ear-left"></div>
                <div class="ear ear-right"></div>
                <div class="teddy-face">
                    <span class="eye eye-left"></span>
                    <span class="eye eye-right"></span>
                    <span class="nose"></span>
                </div>
            </div>

        </div>

    </div>

</body>
</html>
